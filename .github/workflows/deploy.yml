name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [dev, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: 'cloudflare-workers-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Upload Cloudflare Workers PR Preview
        id: wrangler_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN Secret，請先於 GitHub Repository Settings -> Secrets and variables -> Actions 新增。"
            exit 1
          fi

          set +e
          OUTPUT=$(npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} (${GITHUB_SHA:0:7})" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "does not exist|not found|10007"; then
              echo "::warning::Cloudflare Worker 'sanddollar' 尚未初始化建立。請先手動執行一次本 Workflow (Run workflow) 或於本機執行一次 npx wrangler deploy 建立 Worker 骨架，後續 PR Preview 即可正常自動產出預覽網址。"
            fi
            exit "$EXIT_CODE"
          fi

          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1 || true)
          ALIAS_URL=$(echo "$OUTPUT" | grep -Eo 'https://pr-[0-9]+-[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1 || true)

          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "alias_url=${ALIAS_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "### Cloudflare Workers PR Preview"
            echo "- **Branch Preview Alias**: ${ALIAS_URL:-未取得}"
            echo "- **Commit Preview URL**: ${PREVIEW_URL:-未取得}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR Preview URL
        if: always() && (steps.wrangler_preview.outputs.alias_url != '' || steps.wrangler_preview.outputs.preview_url != '')
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cloudflare-workers-preview-comment -->';
            const aliasUrl = '${{ steps.wrangler_preview.outputs.alias_url }}';
            const previewUrl = '${{ steps.wrangler_preview.outputs.preview_url }}';
            const lines = [
              marker,
              '### ☁️ Cloudflare Workers PR Preview 已就緒',
              '',
            ];
            if (aliasUrl) lines.push(`- **PR 固定預覽網址**：${aliasUrl}`);
            if (previewUrl) lines.push(`- **本次 Commit 預覽網址**：${previewUrl}`);
            lines.push('', `> Commit: \`${context.sha.slice(0, 7)}\``);
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN Secret，請先於 GitHub Repository Settings -> Secrets and variables -> Actions 新增。"
            exit 1
          fi
          npx wrangler deploy
